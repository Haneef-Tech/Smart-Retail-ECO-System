services:
  - type: web
    name: smart-retail-eco-system
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon Postgres direct URL (SQLite file no longer supported)
      - key: DIRECT_URL
        sync: false # Same Neon direct URL (used by migrations)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /api/health

