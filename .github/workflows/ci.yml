name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: lint / typecheck / test / build / e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_retail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_retail_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smart_retail_test
      NEXTAUTH_SECRET: ci-test-secret-please-rotate
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-test-password
      GROQ_API_KEY: test-key
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Migrate test database
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e
